name: Pages
# From the site repositories made by sites@AgentiCCells.dinis (2026-11-16). In the
# template itself (.factory-template exists) nothing is deployed: it is built,
# checked and versioned only. A seeded site deploys on every push to dev.
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
  deployments: read  # to read the last successful github-pages deployment, the signing check's anchor
concurrency:
  group: pages
  cancel-in-progress: false
env:
  # Major and minor are set here by a person. The patch number is set by this workflow only:
  # the first release is v0.1.0, and each later push to dev adds one.
  VERSION_BASE: '0.1'
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      deploy: ${{ steps.mode.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No release during a hold
        run: if [ -e board/HOLD.md ]; then echo "board/HOLD.md exists" >&2; exit 1; fi
      - id: version
        name: Work out the next version from the tags
        run: |
          last=$(git tag --list "v${VERSION_BASE}.*" | sed "s/^v${VERSION_BASE}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$last" ]; then next=0; else next=$((last + 1)); fi
          echo "version=v${VERSION_BASE}.${next}" >> "$GITHUB_OUTPUT"
          echo "Version: v${VERSION_BASE}.${next}"
      - id: mode
        name: Deploy unless this is the template itself
        run: if [ -e .factory-template ]; then echo deploy=false >> "$GITHUB_OUTPUT"; else echo deploy=true >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The signature check's own tests (each failing case asserts its reason)
        run: node scripts/test-check-signatures.mjs
      - name: Every commit since the last verified deployment carries an Agent trailer and is signed by its agent's published key
        # Dinis, 19 Nov 2026 (board/guidance/2026-11-19-signed-commits-paid-search-and-free-embeds.md, section 2).
        # security@'s fourth ruling (via conductor.b@, 14:17 UTC): the anchor A is the commit of the last successful
        # github-pages deployment, CI's own record of a passed run, which a pusher cannot write. Tags are not used.
        # The range A..AFTER covers commits from dropped runs; the checks and their config come from A's tree.
        env:
          AFTER: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(git rev-parse --is-shallow-repository)" = false ] || { echo "a shallow checkout cannot be checked" >&2; exit 1; }
          A=""
          for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=50" --jq '.[].id'); do
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state')" = success ]; then
              A=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id" --jq '.sha'); break
            fi
          done
          [ -n "$A" ] || { echo "no successful github-pages deployment to anchor the check" >&2; exit 1; }
          printf %s "$A" | grep -qE '^[0-9a-f]{40}$' || { echo "the deployment's commit is not a commit id" >&2; exit 1; }
          git merge-base --is-ancestor "$A" "$AFTER" || { echo "the last verified deployment $A is not an ancestor of $AFTER" >&2; exit 1; }
          echo "anchor: $A (last successful github-pages deployment)"
          # every security check comes from A's copy; a missing copy fails the step, with no fallback
          for f in check-signatures.mjs check-commits.mjs leak-scan.mjs; do git show "$A:scripts/$f" > "$RUNNER_TEMP/$f"; done
          node "$RUNNER_TEMP/check-commits.mjs" "$A" "$AFTER"
          node "$RUNNER_TEMP/check-signatures.mjs" "$A" "$AFTER"
      - run: node scripts/build.mjs
        env:
          SITE_VERSION: ${{ steps.version.outputs.version }}
      - run: node scripts/validate.mjs
      - name: Leak scan (tracked files and the built site), from the release copy written by the signature step
        run: node "$RUNNER_TEMP/leak-scan.mjs"
      - name: The leak scan's exemptions still catch a key-shaped string beside them
        run: node scripts/test-leak-scan.mjs
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  tag:
    needs: [build, deploy]
    if: ${{ always() && needs.build.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the released commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
